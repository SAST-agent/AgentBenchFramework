<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{ title }}{% if page != 'index' %} · {{ page|replace('_', ' ')|title }}{% endif %}</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --ink:#0c151e;--ink-2:#111e29;--panel:#172632;--panel-2:#1c303d;--line:#2b4351;
  --paper:#f4f0e7;--muted:#aab7c5;--quiet:#718493;--mint:#77d4b5;--amber:#e6b86a;
  --blue:#86a9f5;--rose:#e77b74;--cyan:#84c8d8;--radius:14px;--shadow:0 18px 60px rgba(0,0,0,.18)
}
*{box-sizing:border-box}html{background:var(--ink)}body{margin:0;background:radial-gradient(circle at 82% -10%,#213c4a 0,transparent 34rem),var(--ink);color:var(--paper);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--mint);text-decoration:none}a:hover{color:#a4ead2}.page-shell{max-width:1380px;margin:0 auto;padding:0 34px 52px}.topbar{height:72px;display:flex;align-items:center;gap:25px;border-bottom:1px solid rgba(170,190,205,.15);position:sticky;top:0;background:rgba(12,21,30,.84);backdrop-filter:blur(16px);z-index:10}.brand{display:flex;align-items:center;gap:10px;color:var(--paper);font-weight:750;letter-spacing:-.025em;font-size:16px}.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--mint),var(--blue));color:var(--ink);display:grid;place-items:center}.brand-mark .icon{width:17px;height:17px}.nav-links{display:flex;gap:6px}.nav-link{color:var(--quiet);padding:8px 11px;border-radius:8px;font-size:13px}.nav-link:hover,.nav-link.active{color:var(--paper);background:rgba(119,212,181,.09)}.nav-spacer{flex:1}.nav-meta{color:var(--quiet);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.page-main{padding-top:42px}.eyebrow{color:var(--mint);font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.14em;margin:0 0 11px}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:29px}.hero h1{font-size:clamp(28px,4vw,48px);line-height:1.05;letter-spacing:-.055em;margin:0 0 12px;font-weight:780}.hero p{margin:0;color:var(--muted);max-width:680px;font-size:15px}.hero-aside{text-align:right;color:var(--quiet);font-size:12px}.hero-aside strong{display:block;color:var(--paper);font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:5px}.icon{display:inline-block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}.icon-lg{width:23px;height:23px}.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:15px}.metric{background:linear-gradient(145deg,rgba(28,48,61,.95),rgba(23,38,50,.95));border:1px solid var(--line);border-radius:var(--radius);padding:18px 19px;box-shadow:var(--shadow);min-height:126px}.metric-head{display:flex;align-items:center;gap:8px;color:var(--quiet);font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.metric-head .icon{color:var(--mint)}.metric-value{display:block;color:var(--paper);font:700 clamp(23px,3vw,33px)/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.06em;margin:17px 0 7px}.metric-value.mint{color:var(--mint)}.metric-value.amber{color:var(--amber)}.metric-foot{color:var(--quiet);font-size:11px}.status{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:750;letter-spacing:.02em}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status-success{color:var(--mint);background:rgba(119,212,181,.11)}.status-warning{color:var(--amber);background:rgba(230,184,106,.11)}.status-danger{color:var(--rose);background:rgba(231,123,116,.11)}.status-muted{color:var(--quiet);background:rgba(170,183,197,.09)}.panel{background:rgba(23,38,50,.86);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:15px;box-shadow:var(--shadow)}.panel-header{display:flex;align-items:start;justify-content:space-between;gap:15px;margin-bottom:18px}.panel-title{display:flex;align-items:center;gap:9px;margin:0;color:var(--paper);font-size:15px;font-weight:720}.panel-title .icon{color:var(--mint)}.panel-subtitle{color:var(--quiet);font-size:12px;margin:4px 0 0}.panel-meta{color:var(--quiet);font-size:11px;text-align:right}.chart-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.9fr);gap:15px}.chart-wrap{height:310px;position:relative}.chart-wrap.short{height:255px}.chart-empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--quiet);border:1px dashed rgba(170,183,197,.2);border-radius:10px;padding:20px}.chart-empty .icon{color:var(--amber);margin-bottom:8px}.budget-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.budget-cell{background:rgba(12,21,30,.38);border:1px solid rgba(170,183,197,.12);border-radius:10px;padding:13px}.budget-label{color:var(--quiet);font-size:11px}.budget-value{display:block;color:var(--paper);font:650 19px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:5px}.budget-value.missing{color:var(--quiet)}.table-scroll{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th,.data-table td{text-align:left;padding:12px 10px;border-bottom:1px solid rgba(170,183,197,.12);white-space:nowrap}.data-table th{color:var(--quiet);font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:750}.data-table td{color:var(--muted);font-size:12px}.data-table td strong{color:var(--paper);font-weight:650}.data-table td.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.data-table tbody tr:hover td{background:rgba(119,212,181,.035)}.empty-state{text-align:center;padding:38px 18px;color:var(--quiet)}.empty-state .icon{display:block;margin:0 auto 12px;color:var(--amber)}.note{color:var(--quiet);font-size:11px}.text-muted{color:var(--muted)}.text-quiet{color:var(--quiet)}.text-mint{color:var(--mint)}.text-amber{color:var(--amber)}.text-rose{color:var(--rose)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.chip-list{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);background:rgba(28,48,61,.65);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px}.link-row{cursor:pointer}.section-label{color:var(--quiet);font-size:11px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;margin:28px 0 11px}.delta-positive{color:var(--mint)}.delta-negative{color:var(--rose)}.delta-neutral{color:var(--quiet)}footer{max-width:1380px;margin:0 auto;padding:21px 34px 30px;color:var(--quiet);font-size:11px;border-top:1px solid rgba(170,183,197,.12)}footer a{color:var(--muted)}code{color:var(--amber);font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
@media(max-width:920px){.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-grid{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.hero-aside{text-align:left}}
@media(max-width:600px){.page-shell{padding:0 16px 38px}.topbar{height:62px}.nav-meta{display:none}.nav-links{margin-left:auto}.nav-link{padding:7px 8px}.page-main{padding-top:30px}.metric-grid{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:14px;min-height:112px}.metric-value{font-size:22px}.panel{padding:16px}.budget-grid{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}.panel-header{display:block}.panel-meta{text-align:left;margin-top:7px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
<script src="{{ '../' * depth }}assets/charts.js"></script>
</head>

  <a class="brand" href="{{ '../' * depth }}index.html"><span class="brand-mark">{{ icon('flask') }}</span>AgentBench <span class="text-quiet">/ Research CI</span></a>
