[project]
name = "agentbench-frame"
version = "0.1.0"
description = "Unified agent framework with transparent tracking for THU Saiblo games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tracking = ["psutil"]
rl = ["torch", "numpy"]
report = ["jinja2"]
all = ["psutil", "torch", "numpy", "jinja2"]

[project.scripts]
agentbench = "agentbench_frame.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
]
