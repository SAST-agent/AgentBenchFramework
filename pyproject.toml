[project]
name = "agentbench-frame"
version = "0.1.0"
description = "Unified agent framework with transparent tracking for THU Saiblo games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tracking = ["psutil"]
rl = ["torch", "numpy"]
report = ["jinja2"]
all = ["psutil", "torch", "numpy", "jinja2"]

[project.scripts]
agentbench = "agentbench_frame.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbench_frame"]

[tool.hatch.build.targets.wheel.force-include]
"src/agentbench_frame/research/agentbench_ludi_v1_manifest.json" = "agentbench_frame/research/agentbench_ludi_v1_manifest.json"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
]

[tool.uv]
dev-dependencies = []
