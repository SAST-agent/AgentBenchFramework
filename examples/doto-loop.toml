agent = "example-model"
initial_player_ai = "doto-initial-playerAI.cpp"

[[opponents]]
name = "baseline"
executable = "../agentbench_data/population/23_doto/baseline/main.out"

[llm]
base_url = "https://api.openai.com"
api_key_env = "OPENAI_API_KEY"
model = "gpt-5"
temperature = 0.0
stream = true
max_context_tokens = 1000000

[evaluation]
seeds = [11]
seats = [0, 1]
realtime_scale = 1.0

[budget]
max_iterations = 3
max_builds = 4
max_rollouts = 8
max_episode_reads = 6
max_frame_reads = 1000
max_total_tokens = 1000000
max_wall_seconds = 7200
